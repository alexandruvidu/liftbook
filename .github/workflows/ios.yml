name: iOS CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-package:
    # Xcode 27 image (macOS 27). See actions/runner-images README.
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write  # publish the rolling "latest-build" release (built-in token only)
    env:
      SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
      RESULT_BUNDLE: ${{ github.workspace }}/build/TestResults.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        run: |
          # Resolve symlinks, skip betas / release candidates, pick highest version.
          LATEST=$(
            for app in /Applications/Xcode*.app; do realpath "$app"; done | sort -u |
            grep -v -i -E 'beta|release_candidate|_rc' |
            while read -r app; do
              echo "$(defaults read "$app/Contents/Info" CFBundleShortVersionString) $app"
            done | sort -V | tail -n1 | cut -d' ' -f2-
          )
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), reverse=True)
          phones = [(r, d) for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")]
          # Prefer a standard "iPhone NN" model so screenshots match a typical phone.
          standard = [(r, d) for r, d in phones if re.fullmatch(r"iPhone \d+", d["name"])]
          for r, d in standard + phones:
              print(d["udid"]); sys.stderr.write(d["name"] + " / " + r + "\n"); sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          # Booting up front avoids instruments/lockdown timeouts on a cold simulator.
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Test
        run: |
          set -o pipefail
          mkdir -p "$SCREENSHOT_DIR"
          TEST_RUNNER_SCREENSHOT_DIR="$SCREENSHOT_DIR" xcodebuild test \
            -project Liftbook.xcodeproj \
            -scheme Liftbook \
            -destination "id=$SIM_UDID" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarize test failures
        if: failure()
        run: |
          # Print each failing test with its message from the result bundle.
          xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" --compact \
            | jq -r '.testFailures[]? | "\(.testIdentifierString): \(.failureText)"' \
            || true

      - name: Check screenshots were written
        run: |
          COUNT=$(find "$SCREENSHOT_DIR" -name '*.png' | wc -l | tr -d ' ')
          echo "Found $COUNT screenshot(s):"; ls "$SCREENSHOT_DIR"
          [ "$COUNT" -gt 0 ] || { echo "::error::UI tests produced no screenshots"; exit 1; }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcresult
          path: build/TestResults.xcresult
          if-no-files-found: ignore

      - name: Archive unsigned Release build
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Liftbook.xcodeproj \
            -scheme Liftbook \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Liftbook.xcarchive \
            -quiet \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          rm -rf build/Payload Liftbook.ipa
          mkdir -p build/Payload
          cp -R build/Liftbook.xcarchive/Products/Applications/Liftbook.app build/Payload/
          (cd build && zip -qry ../Liftbook.ipa Payload)
          ls -lh Liftbook.ipa
          python3 scripts/make_source.py build/Payload/Liftbook.app/Info.plist Liftbook.ipa source.json

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: ipa
          path: |
            Liftbook.ipa
            source.json
          if-no-files-found: error

      - name: Publish IPA to rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable public URLs for sideloading:
          #   IPA:    https://github.com/${{ github.repository }}/releases/download/latest-build/Liftbook.ipa
          #   Source: https://github.com/${{ github.repository }}/releases/download/latest-build/source.json
          # Replace the files in place so the download links never disappear,
          # and retry because the releases API sometimes returns HTTP 500.
          NOTES="Unsigned build of ${GITHUB_SHA::7} from main. Sideload with SideStore or LiveContainer."
          publish() {
            if gh release view latest-build -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload latest-build Liftbook.ipa source.json -R "$GITHUB_REPOSITORY" --clobber &&
                gh release edit latest-build -R "$GITHUB_REPOSITORY" --notes "$NOTES"
            else
              gh release create latest-build Liftbook.ipa source.json -R "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --prerelease --title "Latest build" --notes "$NOTES"
            fi
          }
          for attempt in 1 2 3 4; do
            publish && exit 0
            echo "Publish attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
