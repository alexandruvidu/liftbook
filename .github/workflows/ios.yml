name: iOS CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tests run locally before every push (scripts/test.sh); CI only packages the IPA.
  build-package:
    # Xcode 27 image (macOS 27). See actions/runner-images README.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write  # publish the rolling "latest-build" release (built-in token only)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        run: |
          # Resolve symlinks, skip betas / release candidates, pick highest version.
          LATEST=$(
            for app in /Applications/Xcode*.app; do realpath "$app"; done | sort -u |
            grep -v -i -E 'beta|release_candidate|_rc' |
            while read -r app; do
              echo "$(defaults read "$app/Contents/Info" CFBundleShortVersionString) $app"
            done | sort -V | tail -n1 | cut -d' ' -f2-
          )
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      # Exercise pictures are bundled into the app but not committed: they
      # are fetched here (cached between runs) from the IDs in the mappings.
      - name: Cache exercise pictures
        uses: actions/cache@v4
        with:
          path: Liftbook/Resources/ExerciseArt
          key: exercise-art-${{ hashFiles('Liftbook/Resources/exercise-illustrations.json', 'Liftbook/Resources/exercise-animations.json', 'Liftbook/Resources/exercises-more.json') }}

      - name: Fetch exercise pictures
        run: python3 scripts/fetch_exercise_art.py

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive unsigned Release build
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Liftbook.xcodeproj \
            -scheme Liftbook \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Liftbook.xcarchive \
            -quiet \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          rm -rf build/Payload Liftbook.ipa
          mkdir -p build/Payload
          cp -R build/Liftbook.xcarchive/Products/Applications/Liftbook.app build/Payload/
          (cd build && zip -qry ../Liftbook.ipa Payload)
          ls -lh Liftbook.ipa

      - name: Upload IPA
        # The rolling release below is the main download; don't let an
        # artifact-service timeout stop it from being published.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ipa
          path: Liftbook.ipa
          if-no-files-found: error

      - name: Publish IPA to rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release holds only the IPA, at a stable public URL that
          # LiveContainer (or any sideloader) can install from directly:
          #   https://github.com/${{ github.repository }}/releases/download/latest-build/Liftbook.ipa
          # Replace it in place so the link never disappears, and retry
          # because the releases API sometimes returns HTTP 500.
          NOTES="Unsigned build of ${GITHUB_SHA::7} from main. Install in LiveContainer from https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-build/Liftbook.ipa"
          publish() {
            if gh release view latest-build -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload latest-build Liftbook.ipa -R "$GITHUB_REPOSITORY" --clobber &&
                gh release edit latest-build -R "$GITHUB_REPOSITORY" --notes "$NOTES" &&
                # Older builds also published a SideStore source; IPA only now.
                { gh release delete-asset latest-build source.json -R "$GITHUB_REPOSITORY" -y 2>/dev/null || true; }
            else
              gh release create latest-build Liftbook.ipa -R "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --prerelease --title "Latest build" --notes "$NOTES"
            fi
          }
          for attempt in 1 2 3 4; do
            publish && exit 0
            echo "Publish attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
