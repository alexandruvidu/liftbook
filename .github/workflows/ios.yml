name: iOS CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The full suite runs locally before every push (scripts/test.sh all); CI
  # runs the unit tests as a safety net, then packages the IPA.
  build-package:
    # Xcode 27 image (macOS 27). See actions/runner-images README.
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write  # publish the rolling "latest-build" release (built-in token only)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        run: |
          # Resolve symlinks, skip betas / release candidates, pick highest version.
          LATEST=$(
            for app in /Applications/Xcode*.app; do realpath "$app"; done | sort -u |
            grep -v -i -E 'beta|release_candidate|_rc' |
            while read -r app; do
              echo "$(defaults read "$app/Contents/Info" CFBundleShortVersionString) $app"
            done | sort -V | tail -n1 | cut -d' ' -f2-
          )
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      # Exercise pictures are bundled into the app but not committed: they
      # are fetched here (cached between runs) from the IDs in the mappings.
      - name: Cache exercise pictures
        uses: actions/cache@v4
        with:
          path: Liftbook/Resources/ExerciseArt
          key: exercise-art-${{ hashFiles('Liftbook/Resources/exercise-illustrations.json', 'Liftbook/Resources/exercise-animations.json', 'Liftbook/Resources/exercises-more.json') }}

      - name: Fetch exercise pictures
        run: python3 scripts/fetch_exercise_art.py

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # A few minutes; a failing unit test stops the IPA from being published.
      - name: Unit tests
        run: scripts/test.sh

      - name: Archive unsigned Release build
        run: |
          set -o pipefail
          # x.y from project.yml, then the run number as the patch: every build
          # gets a higher version, so LiveContainer / SideStore see an update.
          BASE=$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9]+\.[0-9]+).*/\1/p' project.yml | head -n1)
          VERSION="${BASE:?MARKETING_VERSION not found}.${GITHUB_RUN_NUMBER}"
          echo "Version $VERSION ($GITHUB_RUN_NUMBER)"
          xcodebuild archive \
            -project Liftbook.xcodeproj \
            -scheme Liftbook \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Liftbook.xcarchive \
            -quiet \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          rm -rf build/Payload Liftbook.ipa
          mkdir -p build/Payload
          cp -R build/Liftbook.xcarchive/Products/Applications/Liftbook.app build/Payload/
          (cd build && zip -qry ../Liftbook.ipa Payload)
          ls -lh Liftbook.ipa
          # The source points at this build's own copy (see make_source.py).
          cp Liftbook.ipa "Liftbook-${GITHUB_RUN_NUMBER}.ipa"
          # What changed, for SideStore's version notes: the commit's subject.
          RELEASE_NOTES="$(git log -1 --format=%s)" \
            python3 scripts/make_source.py build/Payload/Liftbook.app/Info.plist Liftbook.ipa source.json

      - name: Upload IPA
        # The rolling release below is the main download; don't let an
        # artifact-service timeout stop it from being published.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ipa
          path: |
            Liftbook.ipa
            source.json
          if-no-files-found: error

      - name: Publish IPA to rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable public URLs for sideloading:
          #   IPA:    https://github.com/${{ github.repository }}/releases/download/latest-build/Liftbook.ipa
          #   Source: https://github.com/${{ github.repository }}/releases/download/latest-build/source.json
          # Replace the files in place so the download links never disappear,
          # and retry because the releases API sometimes returns HTTP 500.
          # The IPAs go up first and source.json last, so the source never
          # names a file that isn't there yet; it points at this build's own
          # Liftbook-<run>.ipa, which is never replaced (SideStore checks its
          # SHA-256). Older per-build IPAs beyond the last 5 are deleted.
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-build"
          BUILD_IPA="Liftbook-${GITHUB_RUN_NUMBER}.ipa"
          NOTES="Unsigned build of ${GITHUB_SHA::7} from main. Add the source to LiveContainer or SideStore for updates: ${BASE}/source.json — or install the IPA directly: ${BASE}/Liftbook.ipa"
          publish() {
            if ! gh release view latest-build -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create latest-build -R "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --prerelease --title "Latest build" --notes "$NOTES" || return 1
            fi
            gh release upload latest-build "$BUILD_IPA" Liftbook.ipa -R "$GITHUB_REPOSITORY" --clobber &&
              gh release upload latest-build source.json -R "$GITHUB_REPOSITORY" --clobber &&
              gh release edit latest-build -R "$GITHUB_REPOSITORY" --notes "$NOTES"
          }
          prune() {
            gh release view latest-build -R "$GITHUB_REPOSITORY" --json assets \
              -q '.assets[].name | select(test("^Liftbook-[0-9]+\\.ipa$"))' |
              sort -t- -k2 -n | awk '{ names[NR] = $0 } END { for (i = 1; i <= NR - 5; i++) print names[i] }' |
              while read -r old; do
                gh release delete-asset latest-build "$old" -R "$GITHUB_REPOSITORY" --yes || true
              done
          }
          for attempt in 1 2 3 4; do
            publish && { prune; exit 0; }
            echo "Publish attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
